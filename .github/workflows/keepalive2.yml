name: keepalive-refresh-offset
on:
  schedule:
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 * * * *'
  workflow_dispatch:

concurrency:
  group: keepalive-refresh-offset
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Hit refresh endpoint
        run: |
          curl -fsS -m 90 https://gamal-monitor.gamal-hametzaits.workers.dev/api/refresh | head -c 400

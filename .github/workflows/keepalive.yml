name: keepalive-refresh
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: keepalive-refresh
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Hit refresh endpoint
        run: |
          curl -fsS -m 90 https://gamal-monitor.gamal-hametzaits.workers.dev/api/refresh | head -c 400

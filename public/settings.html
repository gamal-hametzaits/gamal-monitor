<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#14171A">
<title>הגדרות מנוע · הגמל</title>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500&family=Heebo:wght@400;500;700&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root{--bg:#14171A;--panel:#1A1E22;--line:#2A3036;--txt:#E7E3DA;--dim:#8F968F;--acc:#C9AE6A;--red:#B4574E;--green:#7FA98B;--blue:#7E9FBF}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:Heebo,sans-serif;line-height:1.5;padding-bottom:90px}
header{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
header a{color:var(--acc);text-decoration:none;font-size:14px;border:1px solid var(--line);border-radius:8px;padding:8px 12px}
h1{font:500 20px "Frank Ruhl Libre",serif;flex:1}
section{border-bottom:1px solid var(--line);padding:16px}
h2{font:500 12px "IBM Plex Mono",Heebo,monospace;color:var(--acc);letter-spacing:.06em;margin-bottom:10px}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #20252a}
.row:last-child{border:0}
.row .l{flex:1;min-width:0}.row .l b{font-weight:500;font-size:15px;display:block}.row .l small{color:var(--dim);font-size:12px}
input[type=number],input[type=password]{background:var(--panel);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:10px;width:96px;font:16px "IBM Plex Mono",monospace;text-align:center}
input[type=password]{width:100%;text-align:right;font-family:Heebo}
.sw{position:relative;width:46px;height:26px;flex:none}.sw input{opacity:0;position:absolute;inset:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:2}
.sw i{position:absolute;inset:0;background:#2a3036;border-radius:14px;transition:.15s}.sw i:after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:20px;height:20px;border-radius:50%;background:#8F968F;transition:.15s}
.sw input:checked+i{background:rgba(127,169,139,.35)}.sw input:checked+i:after{background:var(--green);inset-inline-start:23px}
.tag{font:10.5px "IBM Plex Mono",monospace;border:1px solid var(--line);border-radius:3px;padding:0 6px;color:var(--dim);margin-inline-start:6px}
.tag.ok{color:var(--green)}.tag.bad{color:var(--red)}.tag.st{color:var(--acc)}
.srcs{max-height:420px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:0 12px;margin-top:8px}
.note{color:var(--dim);font-size:12.5px;margin-top:8px}
.bar{height:6px;border-radius:3px;background:#242a30;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--acc)}
#foot{position:fixed;bottom:0;inset-inline:0;background:rgba(20,23,26,.97);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:flex;gap:10px;align-items:center}
button{font:500 15px Heebo;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--txt);padding:12px 16px;min-height:46px;cursor:pointer}
button.main{border-color:var(--acc);color:var(--acc);flex:1}
#msg{font-size:13px;color:var(--dim)}
.ok{color:var(--green)}.err{color:var(--red)}
</style></head><body>
<header><a href="/">→ חזרה</a><h1>הגדרות מנוע</h1></header>
<section><h2>קוד גישה</h2>
<input type="password" id="pin" placeholder="קוד גישה (4 תווים ומעלה)" autocomplete="current-password">
<p class="note" id="pinnote"></p></section>
<section><h2>עוזר מודל (LLM)</h2><div id="llm"></div></section>
<section><h2>סף ומתפרצים</h2><div id="thr"></div></section>
<section><h2>התראות דחיפה (ntfy)</h2><div id="push"></div></section>
<section><h2>קצב ומשאבים</h2><div id="rate"></div></section>
<section><h2>מקורות RSS <span class="tag" id="rsssum"></span></h2><p class="note">כבוי = המקור לא נשלף כלל. סטטוס מגיע מהבדיקה האחרונה של השרת, לא מהנחה.</p><div class="srcs" id="rss"></div></section>
<section><h2>ערוצי טלגרם</h2><p class="note">כל הערוצים ציבוריים ולא מאומתים. פריט משם נשאר "אינדיקציה ראשונית" עד שמקור חדשותי מאשר.</p><div class="srcs" id="tg"></div></section>
<section><h2>תצוגה</h2><div id="ui"></div></section>
<section><h2>איפוס</h2><button id="reset">החזר ברירות מחדל</button></section>
<div id="foot"><span id="msg"></span><button class="main" id="save">שמור</button></div>
<script>
let S, D, LIM, SRC = {};
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const relHe = { media: "חדשות", official: "רשמי", state: "מדיה ממלכתית", osint: "OSINT/מחקר" };
const stHe = { ok: "תקין", flaky: "לא יציב", stale: "לא מתעדכן", untested: "טרם נבדק", down: "נפל" };
function sw(id, on, title, sub) { return `<div class="row"><div class="l"><b>${title}</b><small>${sub || ""}</small></div><label class="sw"><input type="checkbox" id="${id}" ${on ? "checked" : ""}><i></i></label></div>`; }
function num(id, v, title, sub, lim) { return `<div class="row"><div class="l"><b>${title}</b><small>${sub || ""}${lim ? " · טווח " + lim[0] + "–" + lim[1] : ""}</small></div><input type="number" id="${id}" value="${v}" min="${lim ? lim[0] : ""}" max="${lim ? lim[1] : ""}" inputmode="numeric"></div>`; }
async function load() {
  const [a, b, c] = await Promise.all([fetch("/api/settings").then(r => r.json()), fetch("/api/sources").then(r => r.json()).catch(() => ({})), fetch("/api/sitrep").then(r => r.json()).catch(() => ({}))]);
  S = a.settings; D = a.defaults; LIM = a.limits;
  ((b.rss || {}).sources || []).forEach(s => SRC[s.name] = s);
  $("pinnote").textContent = a.pinSet ? "הקוד נדרש לכל שינוי. 5 ניסיונות שגויים נועלים ל-15 דקות." : "טרם הוגדר קוד. הקוד שתקליד בשמירה הראשונה יהפוך לקוד הגישה. הגדר אותו מיד, אחרת כל מי שמכיר את הכתובת יכול להגדיר.";
  const llm = c.llm || {};
  $("llm").innerHTML = sw("llmOn", S.llm.on, "שימוש במודל", "מקבץ דיווחים בין שפות ומסווג טענה/עובדה. לעולם לא מעלה דירוג ולא מאמת בעצמו.") +
    num("llmBudget", S.llm.budget, "תקציב ביום (נוירונים)", "מתוך 10,000 בחינם, משותף לפרויקט נוסף. אחרי המכסה: חוזרים לכללים בלבד, בלי חיוב.", LIM["llm.budget"]) +
    `<div class="note">היום: ${llm.usedToday != null ? llm.usedToday : "?"} / ${llm.budget != null ? llm.budget : S.llm.budget} · קריאות ${llm.calls != null ? llm.calls : "?"} · שגיאות ${llm.errors != null ? llm.errors : "?"}<div class="bar"><i style="width:${Math.min(100, ((llm.usedToday || 0) / (S.llm.budget || 1)) * 100)}%"></i></div></div>`;
  $("thr").innerHTML = num("bMin", S.burst.minSrc, "מקורות מינימום למתפרץ", "כמה מקורות נפרדים צריכים לדווח על אותו אירוע.", LIM["burst.minSrc"]) +
    num("bWin", S.burst.winMin, "חלון זמן למתפרץ (דקות)", "כל המקורות בתוך חלון זה.", LIM["burst.winMin"]) +
    num("bAge", S.burst.ageMin, "גיל מקסימלי למתפרץ (דקות)", "אחרי זמן זה האירוע כבר לא נחשב מתפרץ.", LIM["burst.ageMin"]) +
    num("brkWin", S.breakingWinMin, "חלון 'מתפרץ עכשיו' (דקות)", "כמה אחורה הקטע העליון מציג אירועים קריטיים.", LIM.breakingWinMin) +
    num("strH", S.streamHours, "טווח הזרם (שעות)", "אחורה בזמן במסך הראשי.", LIM.streamHours);
  $("push").innerHTML = sw("pushOn", S.push.on, "שליחת התראות", "דורש נושא ntfy שהוגדר. כבוי = לא נשלח כלום.") + sw("pushCrit", S.push.critOnly, "רק קריטי", "בלי התראות ברמת 'אזהרה'.");
  $("rate").innerHTML = num("rotRss", S.rotation.rss, "RSS לכל ריצה (מתחלפים)", "ערוצי מבזקים נשלפים תמיד. יותר = עדכון מהיר יותר אבל קרוב למגבלת 50 קריאות לריצה בחינם.", LIM["rotation.rss"]) +
    num("rotTg", S.rotation.tg, "טלגרם לכל ריצה", "ריצה כל 5 דקות.", LIM["rotation.tg"]) +
    num("poll", S.clientPollSec, "רענון המסך (שניות)", "בטלפון. פחות = יותר סוללה ונתונים.", LIM.clientPollSec);
  $("ui").innerHTML = sw("hideTg", S.hideTg, "הסתר פריטי טלגרם בלבד", "מציג רק פריטים שמקור חדשותי דיווח עליהם. יהיה פחות מהיר.");
  renderSrc();
}
function renderSrc() {
  const rss = window.__rss || (window.__rss = null);
  fetch("/api/settings").then(r => r.json()).then(a => {
    const off = new Set(S.off);
    const rows = a.rss.map(f => { const h = SRC[f.name] || {}; const st = h.status || "untested";
      return `<div class="row"><div class="l"><b>${esc(f.name)}<span class="tag">${esc(f.lang)}</span><span class="tag">${relHe[f.rel] || f.rel}</span>${f.flash ? '<span class="tag st">מבזק</span>' : ""}</b><small><span class="tag ${st === "ok" ? "ok" : st === "untested" ? "" : "bad"}">${stHe[st] || st}</span>${h.newestAgeMin != null ? " פריט אחרון לפני " + (h.newestAgeMin < 120 ? h.newestAgeMin + " דק'" : Math.round(h.newestAgeMin / 60) + " שע'") : ""}</small></div><label class="sw"><input type="checkbox" data-rss="${esc(f.name)}" ${off.has(f.name) ? "" : "checked"}><i></i></label></div>`; });
    $("rss").innerHTML = rows.join("");
    const sum = {}; a.rss.forEach(f => { const s = (SRC[f.name] || {}).status || "untested"; sum[s] = (sum[s] || 0) + 1; });
    $("rsssum").textContent = a.rss.length + " מקורות · " + (sum.ok || 0) + " תקינים";
    const toff = new Set(S.tgOff);
    $("tg").innerHTML = a.tg.map(h => `<div class="row"><div class="l"><b>@${esc(h)}</b><small><span class="tag">לא מאומת</span></small></div><label class="sw"><input type="checkbox" data-tg="${esc(h)}" ${toff.has(h) ? "" : "checked"}><i></i></label></div>`).join("");
  });
}
function collect() {
  const v = id => Number($(id).value), c = id => $(id).checked;
  return { off: [...document.querySelectorAll("[data-rss]")].filter(x => !x.checked).map(x => x.dataset.rss), tgOff: [...document.querySelectorAll("[data-tg]")].filter(x => !x.checked).map(x => x.dataset.tg),
    llm: { on: c("llmOn"), budget: v("llmBudget") }, burst: { minSrc: v("bMin"), winMin: v("bWin"), ageMin: v("bAge") }, breakingWinMin: v("brkWin"), streamHours: v("strH"),
    push: { on: c("pushOn"), critOnly: c("pushCrit") }, rotation: { rss: v("rotRss"), tg: v("rotTg") }, clientPollSec: v("poll"), hideTg: c("hideTg") };
}
async function post(body) {
  const pin = $("pin").value || sessionStorage.getItem("pin") || "";
  const r = await fetch("/api/settings", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ pin, ...body }) });
  const j = await r.json().catch(() => ({}));
  const m = $("msg");
  if (r.ok && j.ok) { sessionStorage.setItem("pin", pin); m.className = "ok"; m.textContent = j.firstSetup ? "נשמר. הקוד הוגדר." : "נשמר."; S = j.settings; return true; }
  m.className = "err"; m.textContent = j.error === "wrong pin" ? "קוד שגוי" : j.error === "locked" ? "נעול, נסה בעוד " + j.retryMin + " דק'" : (j.error || "שגיאה"); return false;
}
$("save").onclick = async () => { if (!($("pin").value || sessionStorage.getItem("pin"))) { $("msg").className = "err"; $("msg").textContent = "הקלד קוד גישה"; return; } if (await post({ settings: collect() })) load(); };
$("reset").onclick = async () => { if (confirm("להחזיר את כל ההגדרות לברירת מחדל?") && await post({ reset: true })) load(); };
load();
</script></body></html>
